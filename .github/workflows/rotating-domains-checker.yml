name: Test Rotating Domains Checker Action

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'test_dry'
        type: choice
        options:
          - 'test_dry'
          - 'test_live'

jobs:
  test-action:
    name: Test Rotating Domains Checker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🚀 Test Rotating Domains Checker
        uses: Alex-302/RotatingDomainsChecker@v1.0.2-test
        with:
          mode: ${{ github.event.inputs.mode || 'test_dry' }}
          config-path: './config.yml'
          filters-path: './'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Upload log file
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rotating-domains-checker-log
          path: logs/rotating-domains-checker.log
          retention-days: 3
