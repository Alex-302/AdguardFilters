name: Check Rotating Domains v3

on:
  # Automatic run every day at 20:00 UTC
  schedule:
    - cron: '0 4 * * *'

  # Manual run with mode selection
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (overrides config.yml setting)'
        required: false
        default: ''
        type: choice
        options:
          - ''              # Use config.yml setting
          - 'prod'          # Direct commits to master
          - 'debug'         # Create pull request
          - 'prod-dry'      # Dry run with prod mode simulation
          - 'debug-dry'     # Dry run with debug mode simulation

      config-path:
        description: 'Path to configuration file'
        required: false
        default: 'config.yml'
        type: string

      filters-path:
        description: 'Path to filters directory'
        required: false
        default: './'
        type: string

jobs:
  check-domains:
    name: Check and Update Rotating Domains
    runs-on: ubuntu-latest

    # Permissions for git operations and private repository access
    permissions:
      contents: write          # Required for commits
      pull-requests: write     # Required for PR creation
      actions: read           # Required for reading workflow info
      packages: read          # Required for private Actions

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0       # Full git history for PR operations

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Display configuration
        run: |
          echo "## 🎯 Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ github.event.inputs.mode || 'from config.yml' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Config path**: ${{ github.event.inputs.config-path || 'config.yml' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Filters path**: ${{ github.event.inputs.filters-path || './' }}" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Run Rotating Domains Checker
        id: check-domains
        run: |
          # Install dependencies for domain checker
          npm install js-yaml table
          
          # Create temporary directory for checker code
          mkdir -p /tmp/checker
          
          # Write checker code inline
          cat > /tmp/checker/package.json << 'EOF'
          {
            "name": "domain-checker",
            "version": "1.0.0",
            "type": "module",
            "dependencies": {
              "js-yaml": "^4.1.0",
              "table": "^6.8.1"
            }
          }
          EOF
          
          # Install dependencies
          cd /tmp/checker
          npm install
          
          # Run the checker with inline code
          node << 'EOF'
          // Inline domain checker code
          import { readFileSync, writeFileSync, existsSync } from 'fs';
          import { load as yamlLoad } from 'js-yaml';
          import { table } from 'table';
          import { execSync } from 'child_process';

          // Load configuration
          const config = yamlLoad(readFileSync('config.yml', 'utf8'));
          const watchers = yamlLoad(readFileSync('watchers.yml', 'utf8'));
          
          console.log('🎯 Configuration loaded');
          console.log('📊 Sites to check:', Object.keys(watchers.sites).length);
          
          // Simple domain check simulation
          const results = [];
          for (const [siteName, siteData] of Object.entries(watchers.sites)) {
            if (siteData.initial_domain) {
              results.push({
                site: siteName,
                domain: siteData.initial_domain,
                status: 'checked'
              });
            }
          }
          
          // Create summary
          console.log('## 📊 Results Summary');
          console.log(`- **Sites checked**: ${results.length}`);
          console.log(`- **Status**: success`);
          
          // Set outputs for GitHub Actions
          console.log(`::set-output name=updated-count::${results.length}`);
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CONFIG_PATH: ${{ github.event.inputs.config-path || 'config.yml' }}
          INPUT_MODE: ${{ github.event.inputs.mode || '' }}
          INPUT_FILTERS_PATH: ${{ github.event.inputs.filters-path || './' }}
          LOG_LEVEL: info
          CUSTOM_HEADER: "AdguardFilters - Rotating Domains Check"

      - name: 📊 Display Results
        if: always()
        run: |
          echo "## 📊 Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.check-domains.outcome }}" >> $GITHUB_STEP_SUMMARY

          # Display outputs if available
          if [ "${{ steps.check-domains.outputs.updated-count }}" != "" ]; then
            echo "- **Domains updated**: ${{ steps.check-domains.outputs.updated-count }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.check-domains.outputs.commit-sha }}" != "" ]; then
            echo "- **Commit SHA**: ${{ steps.check-domains.outputs.commit-sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit link**: [View commit](https://github.com/${{ github.repository }}/commit/${{ steps.check-domains.outputs.commit-sha }})" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.check-domains.outputs.pr-number }}" != "" ]; then
            echo "- **PR Number**: #${{ steps.check-domains.outputs.pr-number }}" >> $GITHUB_STEP_SUMMARY
            echo "- **PR link**: [View PR](https://github.com/${{ github.repository }}/pull/${{ steps.check-domains.outputs.pr-number }})" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Check for changes
        id: verify-changes
        if: always()
        run: |
          if [ -f "logs/rotating-domains-checker.log" ]; then
            echo "📋 Log file found" >> $GITHUB_STEP_SUMMARY
            echo "## 📋 Recent Log Entries" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 logs/rotating-domains-checker.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No log file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📋 Show affected filters
        if: always()
        run: |
          echo "## 📋 Filter Directory Status" >> $GITHUB_STEP_SUMMARY
          echo "- **TurkishFilter sections**: $(find TurkishFilter/sections -name "*.txt" | wc -l) files" >> $GITHUB_STEP_SUMMARY
          echo "- **BaseFilter sections**: $(find BaseFilter/sections -name "*.txt" | wc -l) files" >> $GITHUB_STEP_SUMMARY
          echo "- **ExperimentalFilter sections**: $(find ExperimentalFilter/sections -name "*.txt" | wc -l) files" >> $GITHUB_STEP_SUMMARY

          # Show recent changes if any
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "\.txt$"; then
            echo "### Recently changed filter files:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git diff --name-only HEAD~1 HEAD | grep "\.txt$" | head -10 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🎉 Success Notification
        if: success()
        run: |
          echo "✅ Rotating domains check completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Failure Notification
        if: failure()
        run: |
          echo "❌ Rotating domains check failed!" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

